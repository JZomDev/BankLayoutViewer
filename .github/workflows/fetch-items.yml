name: fetch-items
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run fetch_items.py
        working-directory: scripts
        run: python fetch_items.py --max-updates 50
      - name: Open a PR with the changes
        env:
          GH_TOKEN: ${{ secrets.FETCH_ITEMS_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain cdn)" ]; then
            echo "No changes."
            exit 0
          fi
          branch="fetch-items-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add cdn
          git commit -m "Update item data and images"
          git push origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" \
            --title "Update item data and images" \
            --body "Generated by the fetch-items workflow (run ${{ github.run_id }}). Review and merge manually."
